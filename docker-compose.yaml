version: '3.8'

networks:
  data-network:
    driver: bridge

volumes:
  postgres_data:
    - ./docker/data/postgres_data
  redis_data:
    - ./docker/data/redis_data
  clickhouse_data:
    - ./docker/data/clickhouse_data
  zookeeper_data:
    - ./docker/data/zookeeper_data
  kafka_data:
    - ./docker/data/kafka_data

services:
  # ==============================
  # PostgreSQL
  # ==============================
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # wal_level=logical is required for Debezium CDC
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data-network
  # ==============================
  # PostgreSQL Migration Hook
  # ==============================
  postgres-migration:
    image: postgres:15
    container_name: postgres-migration
    depends_on:
      - postgres
    networks:
      - data-network
    volumes:
      - "./migration/postgres/init.sql:/init.sql"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >
      sh -c "
      echo 'Waiting for PostgreSQL to be ready...' &&
      while ! pg_isready -h postgres -p 5432 -U ${POSTGRES_USER}; do sleep 3; done;
      echo 'PostgreSQL is up! Executing schema migration...' &&
      psql -h postgres -p 5432 -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /init.sql
      "
  # ==============================
  # Redis
  # ==============================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - data-network

  # ==============================
  # ClickHouse
  # ==============================
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # Native interface
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - data-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  # ==============================
  # ClickHouse Migration Hook
  # ==============================
  clickhouse-migration:
    image: clickhouse/clickhouse-client:23.8
    container_name: clickhouse-migration
    depends_on:
      - clickhouse
    networks:
      - data-network
    volumes:
      # Map your local SQL file into the container
      - "./migration/clickhouse/init.sql:/init.sql"
    command: >
      sh -c "
      echo 'Waiting for ClickHouse to be ready...' &&
      while ! clickhouse-client --host clickhouse --port 9000 --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} -q 'SELECT 1' > /dev/null 2>&1; do sleep 3; done;
      echo 'ClickHouse is up! Executing schema migration...' &&
      clickhouse-client --host clickhouse --port 9000 --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} --multiquery < /init.sql
      "

  # ==============================
  # Zookeeper (Required for Kafka)
  # ==============================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - data-network

  # ==============================
  # Kafka
  # ==============================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 29092 for internal network connections, 9092 for external host connections
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - data-network

  # ==============================
  # Debezium (Kafka Connect)
  # ==============================
  debezium:
    build: 
      context: ./context/debezium 
      dockerfile: DockerFile
    container_name: debezium
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      # Ensures topics are created automatically with single partition/replication factor for dev
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # 1. Enable the Environment Variable Config Provider
      CONNECT_CONFIG_PROVIDERS: 'env'
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: 'org.apache.kafka.common.config.provider.EnvVarConfigProvider'
      # 2. Pass your actual credentials so the container has them
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    networks:
      - data-network

  # ==============================
  # Debezium (Kafka Connect Hook)
  # ==============================
  debezium-hook:
    image: curlimages/curl:latest
    depends_on:
      - kafka
      - debezium
    volumes:
      - "./config/debezium:/config"
    networks:
      - data-network
    command: >
      sh -c "
      echo 'Waiting for Debezium REST API...' &&
      while ! curl -s http://debezium:8083 > /dev/null; do sleep 5; done;
      echo 'Debezium is up! Submitting connector configs...' &&
      curl -X POST http://debezium:8083/connectors -H 'Content-Type: application/json' -d @/config/postgres-connector.json &&
      curl -X POST http://debezium:8083/connectors -H 'Content-Type: application/json' -d @/config/clickhouse-sink.json
      "