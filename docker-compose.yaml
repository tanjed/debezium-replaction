networks:
  data-network:
    driver: bridge

volumes:
  postgres_data: {}
  postgres_consumer_data: {}
  redis_data: {}
  clickhouse_data: {}
  kafka_data: {}

services:
  # ==============================
  # PostgreSQL
  # ==============================
  postgres:
    image: postgres:15
    container_name: postgres
    ports:
      - "${POSTGRES_EXTERNAL_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # wal_level=logical is required for Debezium CDC
    command: ["postgres", "-c", "wal_level=logical"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data-network
  # ==============================
  # PostgreSQL Migration Hook
  # ==============================
  postgres-migration:
    image: postgres:15
    container_name: postgres-migration
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data-network
    volumes:
      - "./migration/postgres/init.sql:/init.sql"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: >
      sh -c "
      echo 'Waiting for PostgreSQL to be ready...' &&
      while ! pg_isready -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -U ${POSTGRES_USER}; do sleep 3; done;
      echo 'PostgreSQL is up! Executing schema migration...' &&
      psql -h ${POSTGRES_HOST} -p ${POSTGRES_PORT} -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f /init.sql
      "

  # ==============================
  # Consumer PostgreSQL
  # ==============================
  postgres-consumer:
    image: postgres:15
    container_name: postgres-consumer
    ports:
      - "${CONSUMER_POSTGRES_EXTERNAL_PORT}:5432"
    environment:
      POSTGRES_USER: ${CONSUMER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${CONSUMER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${CONSUMER_POSTGRES_DB}
    volumes:
      - postgres_consumer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONSUMER_POSTGRES_USER} -d ${CONSUMER_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data-network

  # ==============================
  # Consumer PostgreSQL Migration Hook
  # ==============================
  postgres-consumer-migration:
    image: postgres:15
    container_name: postgres-consumer-migration
    depends_on:
      postgres-consumer:
        condition: service_healthy
    networks:
      - data-network
    volumes:
      - "./migration/postgres-consumer/init.sql:/init.sql"
    environment:
      PGPASSWORD: ${CONSUMER_POSTGRES_PASSWORD}
    command: >
      sh -c "
      echo 'Waiting for consumer PostgreSQL to be ready...' &&
      while ! pg_isready -h ${CONSUMER_POSTGRES_HOST} -p ${CONSUMER_POSTGRES_PORT} -U ${CONSUMER_POSTGRES_USER}; do sleep 3; done;
      echo 'Consumer PostgreSQL is up! Executing schema migration...' &&
      psql -h ${CONSUMER_POSTGRES_HOST} -p ${CONSUMER_POSTGRES_PORT} -U ${CONSUMER_POSTGRES_USER} -d ${CONSUMER_POSTGRES_DB} -f /init.sql
      "
  # ==============================
  # Redis
  # ==============================
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - data-network

  # ==============================
  # Kafka UI
  # ==============================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_EXTERNAL_PORT}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: ${KAFKA_HOST}:${KAFKA_INTERNAL_PORT}
      KAFKA_CLUSTERS_0_ZOOKEEPER: ""
      KAFKA_CLUSTERS_0_READONLY: "false"
    networks:
      - data-network

  # ==============================
  # pgAdmin
  # ==============================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    depends_on:
      - postgres
    ports:
      - "${PGADMIN_EXTERNAL_PORT}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "True"
    networks:
      - data-network

  # ==============================
  # Redis Commander
  # ==============================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: redis-commander
    depends_on:
      - redis
    ports:
      - "${REDIS_COMMANDER_EXTERNAL_PORT}:8081"
    environment:
      REDIS_HOSTS: local:${REDIS_HOST}:${REDIS_PORT}
    networks:
      - data-network

  # ==============================
  # ClickHouse
  # ==============================
  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse
    ports:
      - "${CLICKHOUSE_EXTERNAL_PORT}:8123" # HTTP interface
      - "${CLICKHOUSE_NATIVE_EXTERNAL_PORT}:9000" # Native interface
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} -q 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - data-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  # ==============================
  # ClickHouse Migration Hook
  # ==============================
  clickhouse-migration:
    image: clickhouse/clickhouse-server:23.8
    container_name: clickhouse-migration
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - data-network
    volumes:
      # Map your local SQL file into the container
      - "./migration/clickhouse/init.sql:/init.sql"
    command: >
      sh -c "
      echo 'Waiting for ClickHouse to be ready...' &&
      while ! clickhouse-client --host ${CLICKHOUSE_HOST} --port ${CLICKHOUSE_NATIVE_PORT} --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} -q 'SELECT 1' > /dev/null 2>&1; do sleep 3; done;
      echo 'ClickHouse is up! Executing schema migration...' &&
      clickhouse-client --host ${CLICKHOUSE_HOST} --port ${CLICKHOUSE_NATIVE_PORT} --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} --multiquery < /init.sql
      "

  # ==============================
  # Kafka
  # ==============================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT}:9092"
    environment:
      KAFKA_NODE_ID: ${KAFKA_NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_NODE_ID}@${KAFKA_HOST}:${KAFKA_CONTROLLER_PORT}
      # KRaft listeners: internal broker, controller quorum, and external host access
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT},CONTROLLER://0.0.0.0:${KAFKA_CONTROLLER_PORT},PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_HOST}:${KAFKA_INTERNAL_PORT},PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST}:${KAFKA_EXTERNAL_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - data-network

  # ==============================
  # Debezium (Kafka Connect)
  # ==============================
  debezium:
    build: 
      context: ./context/debezium 
      dockerfile: DockerFile
    container_name: debezium
    depends_on:
      - kafka
      - postgres
    ports:
      - "${DEBEZIUM_EXTERNAL_PORT}:8083"
    environment:
      BOOTSTRAP_SERVERS: ${KAFKA_HOST}:${KAFKA_INTERNAL_PORT}
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: my_connect_configs
      OFFSET_STORAGE_TOPIC: my_connect_offsets
      STATUS_STORAGE_TOPIC: my_connect_statuses
      # Ensures topics are created automatically with single partition/replication factor for dev
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      # 1. Enable the Environment Variable Config Provider
      CONNECT_CONFIG_PROVIDERS: 'env'
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: 'org.apache.kafka.common.config.provider.EnvVarConfigProvider'
      # 2. Pass your actual credentials so the container has them
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      CONSUMER_POSTGRES_HOST: ${CONSUMER_POSTGRES_HOST}
      CONSUMER_POSTGRES_PORT: ${CONSUMER_POSTGRES_PORT}
      CONSUMER_POSTGRES_USER: ${CONSUMER_POSTGRES_USER}
      CONSUMER_POSTGRES_PASSWORD: ${CONSUMER_POSTGRES_PASSWORD}
      CONSUMER_POSTGRES_DB: ${CONSUMER_POSTGRES_DB}
      CLICKHOUSE_HOST: ${CLICKHOUSE_HOST}
      CLICKHOUSE_PORT: ${CLICKHOUSE_PORT}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      KAFKA_HOST: ${KAFKA_HOST}
      KAFKA_INTERNAL_PORT: ${KAFKA_INTERNAL_PORT}
    networks:
      - data-network

  # ==============================
  # Debezium (Kafka Connect Hook)
  # ==============================
  debezium-hook:
    image: alpine:3.19
    depends_on:
      kafka:
        condition: service_started
      debezium:
        condition: service_started
      postgres-migration:
        condition: service_completed_successfully
      postgres-consumer-migration:
        condition: service_completed_successfully
      clickhouse-migration:
        condition: service_completed_successfully
    volumes:
      - "./config/debezium:/config"
    networks:
      - data-network
    command: |
      sh -c "
        apk add --no-cache curl jq > /dev/null 2>&1
        
        echo 'Waiting for Debezium REST API...'
        while ! curl -s http://${DEBEZIUM_HOST}:${DEBEZIUM_PORT} > /dev/null; do 
          sleep 5
        done
        
        echo 'Debezium is up! Upserting clickhouse-sink...'
        jq '.config' /config/clickhouse-sink.json > /tmp/sink-config.json
        curl -i -X PUT http://${DEBEZIUM_HOST}:${DEBEZIUM_PORT}/connectors/clickhouse-sink/config -H 'Content-Type: application/json' -d @/tmp/sink-config.json

        echo 'Debezium is up! Upserting postgres-consumer-sink...'
        jq '.config' /config/postgres-consumer-sink.json > /tmp/postgres-consumer-sink-config.json
        curl -i -X PUT http://${DEBEZIUM_HOST}:${DEBEZIUM_PORT}/connectors/postgres-consumer-sink/config -H 'Content-Type: application/json' -d @/tmp/postgres-consumer-sink-config.json
          
        echo 'Upserting postgres source connector (triggers snapshot)...'
        jq '.config' /config/postgres-connector.json > /tmp/pg-config.json
        curl -i -X PUT http://${DEBEZIUM_HOST}:${DEBEZIUM_PORT}/connectors/postgres-inventory-connector/config -H 'Content-Type: application/json' -d @/tmp/pg-config.json
      "